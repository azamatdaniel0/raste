[workspace]
resolver = "2"
members = [
    "crates/paste-core",
    "crates/paste-clipboard",
    "crates/paste-mcp",
    "crates/new-paste",
]
exclude = ["ethalon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
directories = "5.0"
log = "0.4"
env_logger = "0.11"
